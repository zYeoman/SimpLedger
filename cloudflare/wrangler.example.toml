name = "local-money-backup"
main = "backup-worker.js"
compatibility_date = "2026-07-13"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "local-money-backup"

# Set secrets with:
# wrangler secret put BACKUP_TOKEN
#
# Optional: restrict CORS to your app origins (comma separated).
# The Capacitor Android APK uses the https://localhost origin, so include it
# to let the app connect. Leave unset to allow all origins (auth is via BACKUP_TOKEN).
# [vars]
# ALLOWED_ORIGINS = "https://your-app.example.com,https://localhost"
